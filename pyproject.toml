[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "europii-guard"
version = "0.1.3"
description = "Local detection and redaction of personal data in European text: EU national IDs, VAT numbers, IBANs, cards, phones, e-mails."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Since AI ry", email = "info@sinceai.fi" }]
requires-python = ">=3.10"
keywords = ["pii", "privacy", "redaction", "gdpr", "anonymization", "presidio", "eu", "national-id"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
# Pure-Python dependencies only, so the library also runs in Pyodide.
dependencies = ["python-stdnum>=2.0", "phonenumbers>=8.13"]

[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "pip-audit>=2.7"]

[project.scripts]
europii = "europii.cli:main"

[project.urls]
Homepage = "https://github.com/sinceaihq/europii-guard"
Repository = "https://github.com/sinceaihq/europii-guard"
Issues = "https://github.com/sinceaihq/europii-guard/issues"
Dataset = "https://huggingface.co/datasets/sinceaihq/europii-bench"

[tool.hatch.build.targets.wheel]
packages = ["src/europii"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N", "C4", "PT", "PLW1514"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802", "E501"]
"scripts/*" = ["E501"]  # report templates and CLI one-liners
"src/europii/detectors.py" = ["E501"]
"src/europii/bench/templates.py" = ["E501"]
"src/europii/bench/identities.py" = ["E501"]
"src/europii/bench/synthetic.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src/europii"]

[[tool.mypy.overrides]]
module = ["stdnum.*", "phonenumbers.*", "presidio_analyzer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["presidio: needs presidio-analyzer and a spaCy model"]
